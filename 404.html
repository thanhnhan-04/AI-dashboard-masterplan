<!doctype html>
<html lang="vi" data-release="20260912-r1">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Không tìm thấy trang · FinSuccess Dashboard</title>
<script>
const base = "/AI-dashboard-masterplan/";
const path = location.pathname.toLowerCase();
const routes = [
  {match: base.toLowerCase() + "bank/", target: base + "Bank/"},
  {match: base.toLowerCase() + "bank/index.html", target: base + "Bank/"},
  {match: base.toLowerCase() + "ngan-hang/", target: base + "Bank/"},
  {match: base.toLowerCase() + "ngan-hang/index.html", target: base + "Bank/"},
  {match: base.toLowerCase() + "dau-khi/", target: base + "Dau-khi/"},
  {match: base.toLowerCase() + "dau-khi/index.html", target: base + "Dau-khi/"},
  {match: base.toLowerCase() + "sugar/", target: base + "Sugar/"},
  {match: base.toLowerCase() + "sugar/index.html", target: base + "Sugar/"},
  {match: base.toLowerCase() + "duong/", target: base + "Sugar/"},
  {match: base.toLowerCase() + "duong/index.html", target: base + "Sugar/"},
  {match: base.toLowerCase() + "masterplan/", target: base + "Masterplan/"},
  {match: base.toLowerCase() + "masterplan/index.html", target: base + "Masterplan/"}
];
const route = routes.find(x => path === x.match);
if(route){const target=new URL(route.target,location.origin);target.searchParams.set('v',document.documentElement.dataset.release);target.hash=location.hash;location.replace(target.href);}
</script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fc;color:#101318;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.box{max-width:680px;margin:24px;padding:28px;background:#fff;border:1px solid #dfe6f7;border-radius:10px;box-shadow:0 10px 28px rgba(17,37,90,.06)}
h1{margin:0 0 8px;color:#11255a;font-size:28px}p{margin:0 0 16px;color:#3d4653;line-height:1.6}.actions{display:flex;gap:10px;flex-wrap:wrap}
a{display:inline-flex;padding:9px 12px;border-radius:8px;border:1px solid #dfe6f7;text-decoration:none;font-weight:800;font-size:13px;color:#11255a}
a.primary{background:#11255a;color:#fff;border-color:#11255a}
</style>
</head>
<body>
<main class="box">
  <h1>Không tìm thấy trang</h1>
  <p>URL có thể sai chữ hoa/thường hoặc file chưa được upload lên đúng root GitHub Pages. Quay về master database để mở dashboard ngành hiện có.</p>
  <div class="actions">
    <a class="primary" href="/AI-dashboard-masterplan/">Master database</a>
    <a href="/AI-dashboard-masterplan/Dau-khi/">Dashboard Dầu khí</a>
    <a href="/AI-dashboard-masterplan/Sugar/">Dashboard Đường</a>
    <a href="/AI-dashboard-masterplan/Bank/">Dashboard Ngân hàng</a>
  </div>
</main>
<script>document.querySelectorAll('.actions a').forEach(a=>{const url=new URL(a.href);url.searchParams.set('v',document.documentElement.dataset.release);a.href=url.href;});</script>
</body>
</html>
